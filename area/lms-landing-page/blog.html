<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - LMS Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .filter-btn { transition: all 0.2s; }
        .filter-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
        .prose { @apply text-slate-700 leading-relaxed; }
        .prose h1 { @apply text-3xl font-extrabold mt-8 mb-4 text-slate-900; }
        .prose h2 { @apply text-2xl font-bold mt-8 mb-4 text-slate-900; }
        .prose h3 { @apply text-xl font-bold mt-6 mb-3 text-slate-900; }
        .prose p { @apply mb-4; }
        .prose ul { @apply list-disc list-inside mb-4 space-y-2; }
        .prose ol { @apply list-decimal list-inside mb-4 space-y-2; }
        .prose code { @apply bg-slate-100 px-1.5 py-0.5 rounded text-sm font-mono text-blue-700; }
        .prose pre { @apply bg-slate-900 text-slate-100 p-4 rounded-xl overflow-x-auto mb-4; }
        .prose pre code { @apply bg-transparent p-0 text-sm; }
        .prose blockquote { @apply border-l-4 border-blue-500 pl-4 italic text-slate-600 my-4; }
        .prose a { @apply text-blue-600 hover:underline; }
        .prose img { @apply rounded-xl my-6 max-w-full; }
        .prose table { @apply w-full border-collapse mb-4; }
        .prose th, .prose td { @apply border border-slate-200 px-4 py-2 text-left; }
        .prose th { @apply bg-slate-100 font-bold; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div class="fixed top-0 w-full z-50 glass border-b border-slate-200">
        <nav class="flex items-center justify-between px-8 py-4 max-w-7xl mx-auto" id="main-nav">
            <div class="text-2xl font-extrabold text-blue-600 flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                <i class="fas fa-graduation-cap"></i> <span>LMS Blog</span>
            </div>
            <div class="hidden md:flex gap-8 font-semibold text-slate-600" id="nav-links">
                <a href="index.html" class="hover:text-blue-600 transition-all">Home</a>
                <a href="kursus.html" class="hover:text-blue-600 transition-all">Kursus</a>
                <a href="blog.html" class="text-blue-600 font-bold">Blog</a>
                <a href="admin.html" class="hover:text-blue-600 transition-all hidden" id="admin-nav-link">Admin Panel</a>
            </div>
            <div class="flex gap-4 items-center" id="auth-buttons">
                <a href="login.html" class="hidden sm:block px-5 py-2 text-slate-600 font-bold hover:text-blue-600 transition">Login</a>
                <a href="register.html" class="px-6 py-2 bg-blue-600 text-white rounded-full font-bold hover:bg-blue-700 transition-all">Daftar</a>
            </div>
            <div class="hidden" id="user-menu">
                <div class="relative">
                    <button id="user-menu-btn" class="flex items-center gap-2 px-4 py-2 bg-white rounded-full border border-slate-200 hover:bg-slate-50 transition">
                        <img id="user-avatar" src="" class="w-8 h-8 rounded-full" alt="Avatar">
                        <span id="user-name" class="font-semibold text-slate-700"></span>
                        <i class="fas fa-chevron-down text-xs text-slate-500"></i>
                    </button>
                    <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-2xl shadow-xl border border-slate-100 py-2 z-50">
                        <a href="kursus.html?my=courses" class="block px-4 py-2 text-slate-700 hover:bg-slate-50 flex items-center gap-2"><i class="fas fa-book w-5"></i> Kursus Saya</a>
                        <a href="admin.html" class="block px-4 py-2 text-slate-700 hover:bg-slate-50 flex items-center gap-2 hidden" id="admin-dropdown-link"><i class="fas fa-cog w-5"></i> Admin Panel</a>
                        <hr class="my-2 border-slate-100">
                        <button onclick="LMS.logout(); window.location.reload()" class="block w-full text-left px-4 py-2 text-red-600 hover:bg-red-50 flex items-center gap-2"><i class="fas fa-sign-out-alt w-5"></i> Logout</button>
                    </div>
                </div>
            </div>
        </nav>
    </div>

    <div class="max-w-4xl mx-auto px-8 py-24">
        <!-- Header -->
        <div class="text-center mb-12" data-aos="fade-down">
            <h1 class="text-5xl font-black mb-4">Knowledge <span class="text-blue-600">Hub</span> ✍️</h1>
            <p class="text-slate-500 text-lg">Berbagi tips, trik, dan penderitaan saat ngoding.</p>
        </div>

        <!-- Search & Filters -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 mb-10" data-aos="fade-up">
            <div class="flex flex-col md:flex-row gap-6">
                <div class="flex-1 relative">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" placeholder="Cari artikel... (judul, kategori, tag)" class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                </div>
                <div class="flex flex-wrap gap-3" id="category-filters">
                    <button class="filter-btn active px-5 py-2 bg-blue-600 text-white rounded-full font-bold text-sm" data-category="all">Semua</button>
                </div>
                <select id="sort-select" class="px-5 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition bg-white">
                    <option value="newest">Terbaru</option>
                    <option value="popular">Paling Dibaca</option>
                    <option value="liked">Paling Disukai</option>
                    <option value="oldest">Terlama</option>
                </select>
            </div>
        </div>

        <!-- Blog Posts List -->
        <div class="space-y-8" id="posts-container">
            <!-- Rendered by JS -->
        </div>

        <!-- Pagination -->
        <div class="flex justify-center gap-2 mt-12" id="pagination">
            <!-- Rendered by JS -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-20">
            <i class="fas fa-newspaper text-6xl text-slate-300 mb-4"></i>
            <h3 class="text-2xl font-bold text-slate-600 mb-2">Artikel nggak ketemu</h3>
            <p class="text-slate-500">Coba ubah filter atau kata kunci pencarian</p>
        </div>
    </div>

    <!-- Post Detail Modal -->
    <div id="post-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closePostModal()"></div>
        <div class="relative bg-white rounded-3xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto animate-scale-in">
            <div id="post-modal-content"></div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="shared.js"></script>
    <script>
        AOS.init();

        // State
        let allPosts = [];
        let filteredPosts = [];
        let currentPage = 1;
        const perPage = 6;
        let activeCategory = 'all';
        let searchQuery = '';
        let sortBy = 'newest';

        document.addEventListener('DOMContentLoaded', () => {
            updateAuthUI();
            loadPosts();
            setupFilters();
            setupSearch();
            setupSort();
            setupUserMenu();
        });

        function updateAuthUI() {
            const user = LMS.getCurrentUser();
            const authButtons = document.getElementById('auth-buttons');
            const userMenu = document.getElementById('user-menu');
            const adminNavLink = document.getElementById('admin-nav-link');
            const adminDropdownLink = document.getElementById('admin-dropdown-link');

            if (user) {
                authButtons.classList.add('hidden');
                userMenu.classList.remove('hidden');
                document.getElementById('user-name').textContent = user.firstName;
                document.getElementById('user-avatar').src = user.avatar;
                if (user.role === 'admin') {
                    adminNavLink.classList.remove('hidden');
                    adminDropdownLink.classList.remove('hidden');
                }
            } else {
                authButtons.classList.remove('hidden');
                userMenu.classList.add('hidden');
                adminNavLink.classList.add('hidden');
                adminDropdownLink.classList.add('hidden');
            }
        }

        function setupUserMenu() {
            const btn = document.getElementById('user-menu-btn');
            const dropdown = document.getElementById('user-dropdown');
            btn?.addEventListener('click', (e) => { e.stopPropagation(); dropdown.classList.toggle('hidden'); });
            document.addEventListener('click', () => dropdown?.classList.add('hidden'));
        }

        function loadPosts() {
            allPosts = LMS.getBlogPosts({ published: true });
            buildCategoryFilters();
            applyFilters();
        }

        function buildCategoryFilters() {
            const categories = [...new Set(allPosts.map(p => p.category))].sort();
            const container = document.getElementById('category-filters');
            const allBtn = container.querySelector('[data-category="all"]');
            container.innerHTML = '';
            container.appendChild(allBtn);
            
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn px-5 py-2 border border-slate-200 text-slate-600 rounded-full font-bold text-sm hover:bg-slate-50 hover:border-blue-300 transition';
                btn.dataset.category = cat.toLowerCase().replace(/\s+/g, '-');
                btn.textContent = cat;
                btn.addEventListener('click', () => setCategory(btn.dataset.category));
                container.appendChild(btn);
            });
        }

        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => setCategory(btn.dataset.category));
            });
        }

        function setupSearch() {
            const input = document.getElementById('search-input');
            let debounceTimer;
            input.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    searchQuery = e.target.value.toLowerCase();
                    currentPage = 1;
                    applyFilters();
                }, 300);
            });
        }

        function setupSort() {
            document.getElementById('sort-select').addEventListener('change', (e) => {
                sortBy = e.target.value;
                applyFilters();
            });
        }

        function setCategory(category) {
            activeCategory = category;
            currentPage = 1;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.category === category);
                if (btn.classList.contains('active')) {
                    btn.classList.remove('border-slate-200', 'text-slate-600', 'hover:bg-slate-50');
                    btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
                } else {
                    btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
                    btn.classList.add('border-slate-200', 'text-slate-600');
                }
            });
            applyFilters();
        }

        function applyFilters() {
            filteredPosts = allPosts.filter(post => {
                const matchesCategory = activeCategory === 'all' || post.category.toLowerCase().replace(/\s+/g, '-') === activeCategory;
                const matchesSearch = !searchQuery || 
                    post.title.toLowerCase().includes(searchQuery) ||
                    post.excerpt.toLowerCase().includes(searchQuery) ||
                    post.category.toLowerCase().includes(searchQuery) ||
                    post.author.name.toLowerCase().includes(searchQuery) ||
                    post.tags.some(t => t.toLowerCase().includes(searchQuery));
                return matchesCategory && matchesSearch;
            });

            // Sort
            switch (sortBy) {
                case 'popular': filteredPosts.sort((a, b) => b.views - a.views); break;
                case 'liked': filteredPosts.sort((a, b) => b.likes - a.likes); break;
                case 'oldest': filteredPosts.sort((a, b) => new Date(a.publishedAt) - new Date(b.publishedAt)); break;
                default: filteredPosts.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
            }

            renderPosts();
            renderPagination();
        }

        function renderPosts() {
            const container = document.getElementById('posts-container');
            const emptyState = document.getElementById('empty-state');
            const start = (currentPage - 1) * perPage;
            const pagePosts = filteredPosts.slice(start, start + perPage);

            if (pagePosts.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = pagePosts.map((post, i) => `
                <article class="group bg-white p-8 rounded-3xl shadow-sm border border-slate-100 hover:shadow-xl transition-all duration-300 cursor-pointer" data-aos="fade-up" data-aos-delay="${(i % 4) * 100}" onclick="openPostModal('${post.slug}')">
                    <div class="flex items-center gap-4 mb-4">
                        <span class="px-3 py-1 bg-blue-100 text-blue-600 rounded-lg text-xs font-bold">${post.category}</span>
                        <span class="text-slate-400 text-xs">${LMS.formatDate(post.publishedAt)}</span>
                        <span class="text-slate-400 text-xs ml-auto flex items-center gap-1"><i class="fas fa-eye"></i> ${post.views.toLocaleString('id-ID')}</span>
                    </div>
                    <h2 class="text-2xl font-bold mb-3 group-hover:text-blue-600 transition-colors">${post.title}</h2>
                    <p class="text-slate-600 leading-relaxed mb-6 line-clamp-3">${post.excerpt}</p>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <img src="${post.author.avatar}" class="w-8 h-8 rounded-full" alt="${post.author.name}">
                            <span class="font-medium text-slate-700">${post.author.name}</span>
                        </div>
                        <div class="flex items-center gap-2 text-blue-600 font-bold group-hover:gap-4 transition-all">
                            Baca Selengkapnya <i class="fas fa-arrow-right"></i>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredPosts.length / perPage);
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            html += `<button onclick="changePage(${currentPage - 1})" class="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition ${currentPage === 1 ? 'opacity-50 cursor-not-allowed' : ''}" ${currentPage === 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>`;
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    html += `<button onclick="changePage(${i})" class="w-10 h-10 rounded-xl font-bold transition ${i === currentPage ? 'bg-blue-600 text-white' : 'border border-slate-200 text-slate-600 hover:bg-slate-50'}">${i}</button>`;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    html += `<span class="w-10 h-10 flex items-center justify-center text-slate-400">...</span>`;
                }
            }
            
            html += `<button onclick="changePage(${currentPage + 1})" class="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 disabled:opacity-50 disabled:cursor-not-allowed transition ${currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : ''}" ${currentPage === totalPages ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>`;
            
            container.innerHTML = html;
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredPosts.length / perPage);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderPosts();
            renderPagination();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openPostModal(slug) {
            const post = LMS.getBlogPostBySlug(slug);
            if (!post) return;
            
            // Increment views (simulate)
            const posts = LMS.getStorage(LMS.STORAGE_KEYS.BLOG_POSTS);
            const idx = posts.findIndex(p => p.id === post.id);
            if (idx !== -1) {
                posts[idx].views = (posts[idx].views || 0) + 1;
                LMS.setStorage(LMS.STORAGE_KEYS.BLOG_POSTS, posts);
            }
            
            document.getElementById('post-modal-content').innerHTML = `
                <article class="p-8">
                    <header class="mb-8">
                        <div class="flex items-center gap-3 mb-4">
                            <span class="px-3 py-1 bg-blue-100 text-blue-600 rounded-lg text-xs font-bold">${post.category}</span>
                            <span class="text-slate-400 text-sm">${LMS.formatDate(post.publishedAt)}</span>
                            <span class="text-slate-400 text-sm ml-auto flex items-center gap-1"><i class="fas fa-eye"></i> ${post.views.toLocaleString('id-ID')}</span>
                            <span class="text-slate-400 text-sm flex items-center gap-1"><i class="fas fa-heart text-red-500"></i> ${post.likes}</span>
                            <span class="text-slate-400 text-sm flex items-center gap-1"><i class="fas fa-clock"></i> ${post.readTime}</span>
                        </div>
                        <h1 class="text-3xl md:text-4xl font-extrabold mb-4 text-slate-900">${post.title}</h1>
                        <div class="flex items-center gap-4">
                            <img src="${post.author.avatar}" class="w-10 h-10 rounded-full" alt="${post.author.name}">
                            <div>
                                <p class="font-bold text-slate-700">${post.author.name}</p>
                                <p class="text-sm text-slate-500">${post.tags.slice(0, 3).map(t => `#${t}`).join(' ')}</p>
                            </div>
                        </div>
                    </header>
                    
                    <div class="prose max-w-none" id="post-content">
                        ${post.content}
                    </div>
                    
                    <footer class="mt-10 pt-8 border-t border-slate-200">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <button onclick="likePost(${post.id})" class="flex items-center gap-2 px-4 py-2 bg-red-50 text-red-600 rounded-xl hover:bg-red-100 transition">
                                    <i class="fas fa-heart"></i> <span id="like-count">${post.likes}</span> Suka
                                </button>
                                <button onclick="sharePost('${post.slug}', '${post.title}')" class="flex items-center gap-2 px-4 py-2 bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-100 transition">
                                    <i class="fas fa-share"></i> Bagikan
                                </button>
                            </div>
                            <button onclick="closePostModal()" class="px-6 py-2 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition">Tutup</button>
                        </div>
                    </footer>
                </article>
            `;
            
            document.getElementById('post-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closePostModal() {
            document.getElementById('post-modal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        function likePost(postId) {
            const posts = LMS.getStorage(LMS.STORAGE_KEYS.BLOG_POSTS);
            const idx = posts.findIndex(p => p.id === postId);
            if (idx !== -1) {
                posts[idx].likes = (posts[idx].likes || 0) + 1;
                LMS.setStorage(LMS.STORAGE_KEYS.BLOG_POSTS, posts);
                document.getElementById('like-count').textContent = posts[idx].likes;
                LMS.showToast('Terima kasih sudah like! ❤️', 'success');
            }
        }

        function sharePost(slug, title) {
            const url = `${window.location.origin}${window.location.pathname}?post=${slug}`;
            if (navigator.share) {
                navigator.share({ title, url });
            } else {
                navigator.clipboard.writeText(url);
                LMS.showToast('Link disalin ke clipboard!', 'success');
            }
        }
    </script>
</body>
</html>
