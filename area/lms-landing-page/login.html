<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LMS Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen px-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
        <div class="text-center mb-10">
            <div class="text-3xl font-extrabold text-blue-600 flex justify-center items-center gap-2 mb-2">
                <i class="fas fa-graduation-cap"></i> LMS Blog
            </div>
            <p class="text-slate-500">Selamat datang kembali, Bos Bima!</p>
        </div>
        <form class="space-y-6" onsubmit="event.preventDefault(); window.location.href='admin.html'">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Email Address</label>
                <input type="email" placeholder="nama@email.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition" required>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Password</label>
                <input type="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition" required>
            </div>
            <div class="flex justify-between items-center text-sm">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="rounded text-blue-600"> Ingat saya
                </label>
                <a href="#" class="text-blue-600 font-bold hover:underline">Lupa Password?</a>
            </div>
            <button type="submit" class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 active:scale-95">Login Sekarang</button>
        </form>
        <p class="text-center mt-8 text-slate-600">Belum punya akun? <a href="register.html" class="text-blue-600 font-bold hover:underline">Daftar di sini</a></p>
    </div>
</body>
</html>
